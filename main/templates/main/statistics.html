{% extends 'main/base.html' %}

{% block content %}

    <h3 class="mt-3">Статистика</h3>

    <h5 class="mt-3">Записей в базе данных</h5>
    <table class="table">
      <tbody>
    {% for stat_name, stat_value in database_records.items  %}
      <tr>
        <th scope="row">{{ stat_name }}</th>
        <td>{{ stat_value }}</td>
      </tr>
    {% endfor %}
      </tbody>

{% endblock %}
