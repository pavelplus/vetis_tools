{% extends 'main/base.html' %}

{% block content %}

    <h3 class="mt-3">Статистика</h3>

    <div class="row justify-content-center">
      <div class="col-lg-6">
        <h5 class="mt-3">Записей в базе данных</h5>
        <table class="table col-lg-6">
          <tbody>
            {% for stat_name, stat_value in database_records.items  %}
              <tr>
                <th scope="row">{{ stat_name }}</th>
                <td>{{ stat_value }}</td>
              </tr>
            {% endfor %}
          </tbody>
      </div>
    </div>

{% endblock %}
